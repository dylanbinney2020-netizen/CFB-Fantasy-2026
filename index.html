@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
.cfb { --navy:#0B1220; --char:#141B29; --panel:#1B2333; --panel2:#232D40; --line:#2B3648;
       --white:#F7F9FC; --gray:#95A3B8; --dim:#6B7789;
       --acc:#E8A33D; --acc2:#4A90C8; --win:#3FCF8E; --loss:#F2726F;
       background:var(--navy); color:var(--white); min-height:100vh;
       font-family:Inter,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
.cfb *, .cfb *::before, .cfb *::after { box-sizing:border-box; }
.cfb h1,.cfb h2,.cfb h3 { font-family:'Barlow Condensed',Impact,sans-serif; font-weight:800;
       text-transform:uppercase; letter-spacing:.005em; margin:0; line-height:1.02; }
.cfb .num { font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; font-weight:700; }
.cfb .eyebrow { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
       letter-spacing:.14em; text-transform:uppercase; color:var(--gray); }
.cfb .shell { max-width:960px; margin:0 auto; padding:0 16px 64px; }
.cfb .pnl { background:var(--char); border:1px solid var(--line); border-radius:14px;
       box-shadow:0 1px 2px rgba(0,0,0,.35); }
.cfb .lnk { background:none; border:0; padding:0; color:inherit; font:inherit; cursor:pointer;
       text-align:left; }
.cfb .lnk:hover { color:var(--acc); }
.cfb .bt { font-family:Inter,sans-serif; font-size:14px; font-weight:600; cursor:pointer;
       border-radius:10px; border:1px solid var(--line); background:var(--panel);
       color:var(--white); padding:10px 15px; transition:background .15s,border-color .15s; }
.cfb .bt:hover:not(:disabled) { background:var(--panel2); border-color:var(--dim); }
.cfb .bt:disabled { opacity:.35; cursor:not-allowed; }
.cfb .bt-acc { background:var(--acc); border-color:var(--acc); color:#141B29; }
.cfb .bt-acc:hover:not(:disabled) { background:#F0B255; border-color:#F0B255; }
.cfb .ctl { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px;
       padding:10px 12px; color:var(--white); font-size:14px; font-family:Inter,sans-serif; }
.cfb .ctl::placeholder { color:var(--dim); }
.cfb .ctl:disabled { opacity:.4; }
.cfb .fx { display:flex; align-items:center; }
.cfb button:focus-visible, .cfb input:focus-visible, .cfb select:focus-visible,
.cfb [role=button]:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.cfb .nav { position:sticky; top:0; z-index:50; background:rgba(11,18,32,.97);
       backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.cfb .navscroll { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.cfb .navscroll::-webkit-scrollbar { display:none; }
.cfb .navitem { flex:0 0 auto; background:none; border:0; cursor:pointer; padding:12px 13px;
       font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
       text-transform:uppercase; letter-spacing:.03em; color:var(--gray);
       border-bottom:3px solid transparent; white-space:nowrap; }
.cfb .navitem:hover { color:var(--white); }
.cfb .navitem.act { color:var(--acc); border-bottom-color:var(--acc); }
.cfb .badge { display:inline-flex; align-items:center; font-family:'JetBrains Mono',monospace;
       font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
       padding:3px 7px; border-radius:5px; border:1px solid; white-space:nowrap; }
.cfb .av { border-radius:10px; display:flex; align-items:center; justify-content:center;
       font-family:'Barlow Condensed',sans-serif; font-weight:800; color:#0B1220; flex:0 0 auto; }
.cfb .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cfb .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.cfb .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.cfb .gridL { display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
@media (max-width:640px){ .cfb .grid3 { grid-template-columns:1fr 1fr; }
                          .cfb .grid4 { grid-template-columns:1fr 1fr; }
                          .cfb .gridL { grid-template-columns:1fr 1fr; } }
@media (max-width:420px){ .cfb .grid2, .cfb .grid3 { grid-template-columns:1fr; } }
/* ---- draft room ---- */
.cfb .seg { display:flex; gap:3px; background:var(--char); border:1px solid var(--line);
       border-radius:11px; padding:3px; overflow-x:auto; scrollbar-width:none; }
.cfb .seg::-webkit-scrollbar { display:none; }
.cfb .seg button { flex:1 0 auto; min-width:78px; min-height:38px; border:0; cursor:pointer;
       background:transparent; color:var(--gray); border-radius:8px; padding:8px 12px;
       font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14.5px;
       text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; transition:.14s; }
.cfb .seg button:hover { color:var(--white); }
.cfb .seg button.on { background:var(--acc); color:#0B1220; }
.cfb .clockbar { position:sticky; top:96px; z-index:25; margin-bottom:14px; }
.cfb .bscroll { overflow-x:auto; overflow-y:visible; -webkit-overflow-scrolling:touch;
       border:1px solid var(--line); border-radius:14px; background:var(--char); }
.cfb .bgrid { display:grid; }
.cfb .bh { position:sticky; top:0; z-index:3; background:var(--panel);
       border-bottom:1px solid var(--line); padding:7px 4px; text-align:center; }
.cfb .brnd { position:sticky; left:0; z-index:4; background:var(--panel);
       border-right:1px solid var(--line); display:flex; align-items:center;
       justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700;
       font-size:11px; color:var(--gray); }
.cfb .bcorner { position:sticky; left:0; top:0; z-index:6; background:var(--panel2);
       border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.cfb .bcell { border-right:1px solid var(--line); border-bottom:1px solid var(--line);
       padding:6px 5px; min-height:54px; display:flex; flex-direction:column;
       justify-content:center; overflow:hidden; }
.cfb .pulse { animation:cfbpulse 1.9s ease-in-out infinite; }
@keyframes cfbpulse { 0%,100%{opacity:1} 50%{opacity:.42} }
.cfb .tick { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }
.cfb .sheet { position:fixed; inset:0; z-index:80; background:rgba(6,10,18,.78);
       backdrop-filter:blur(4px); display:flex; align-items:center;
       justify-content:center; padding:18px; }
.cfb .sheetcard { background:var(--char); border:1px solid var(--line); border-radius:16px;
       padding:18px; width:100%; max-width:390px; box-shadow:0 18px 50px rgba(0,0,0,.6); }
.cfb .rankpill { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10.5px;
       min-width:26px; text-align:center; padding:2px 5px; border-radius:5px;
       background:var(--panel2); border:1px solid var(--line); color:var(--gray); }
.cfb .big { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;
       font-weight:700; letter-spacing:-.02em; }
@media (prefers-reduced-motion:reduce){ .cfb * { transition:none !important; }
                                        .cfb .pulse { animation:none !important; } }
