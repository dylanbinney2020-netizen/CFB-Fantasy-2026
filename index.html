@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
/* Light theme. The names are semantic rather than literal: a variable called
   --navy holding an off-white would be actively misleading to read later.
   Accents are DEEPER than the dark theme's. Amber #E8A33D reads about 2:1
   against white, which is unreadable, so each keeps its hue but darkens enough
   to be legible on a light surface. */
.cfb { --bg:#F6F7F9; --surface:#FFFFFF; --panel:#FFFFFF; --panel2:#EEF1F5; --line:#DDE2EA;
       --text:#141922; --muted:#5A6675; --faint:#8A93A1;
       --acc:#A56413; --acc2:#2A6A9C; --win:#12805A; --loss:#B8322D;
       --on-acc:#FFFFFF;
       background:var(--bg); color:var(--text); min-height:100vh;
       font-family:Inter,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
.cfb *, .cfb *::before, .cfb *::after { box-sizing:border-box; }
.cfb h1,.cfb h2,.cfb h3 { font-family:'Barlow Condensed',Impact,sans-serif; font-weight:800;
       text-transform:uppercase; letter-spacing:.005em; margin:0; line-height:1.02; }
.cfb .num { font-family:Inter,system-ui,sans-serif; font-variant-numeric:tabular-nums;
       font-weight:600; letter-spacing:0; }
.cfb .eyebrow { font-family:Inter,system-ui,sans-serif; font-size:10px; font-weight:600;
       letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.cfb .shell { max-width:960px; margin:0 auto; padding:0 16px 64px; }
.cfb .pnl { background:var(--surface); border:1px solid var(--line); border-radius:14px;
       box-shadow:0 1px 2px rgba(20,25,34,.05); }
.cfb .lnk { background:none; border:0; padding:0; color:inherit; font:inherit; cursor:pointer;
       text-align:left; }
.cfb .lnk:hover { color:var(--acc); }
.cfb .bt { font-family:Inter,sans-serif; font-size:14px; font-weight:600; cursor:pointer;
       border-radius:10px; border:1px solid var(--line); background:var(--panel);
       color:var(--text); padding:10px 15px; transition:background .15s,border-color .15s; }
.cfb .bt:hover:not(:disabled) { background:var(--panel2); border-color:var(--faint); }
.cfb .bt:disabled { opacity:.35; cursor:not-allowed; }
.cfb .bt-acc { background:var(--acc); border-color:var(--acc); color:var(--on-acc); }
.cfb .bt-acc:hover:not(:disabled) { background:#8C520C; border-color:#8C520C; }
.cfb .ctl { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px;
       padding:10px 12px; color:var(--text); font-size:14px; font-family:Inter,sans-serif; }
.cfb .ctl::placeholder { color:var(--faint); }
.cfb .ctl:disabled { opacity:.4; }
.cfb .fx { display:flex; align-items:center; }
.cfb button:focus-visible, .cfb input:focus-visible, .cfb select:focus-visible,
.cfb [role=button]:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.cfb .nav { position:sticky; top:0; z-index:50; background:rgba(246,247,249,.96);
       backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.cfb .navscroll { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.cfb .navscroll::-webkit-scrollbar { display:none; }
.cfb .navitem { flex:0 0 auto; background:none; border:0; cursor:pointer; padding:12px 13px;
       font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
       text-transform:uppercase; letter-spacing:.03em; color:var(--muted);
       border-bottom:3px solid transparent; white-space:nowrap; }
.cfb .navitem:hover { color:var(--text); }
.cfb .navitem.act { color:var(--acc); border-bottom-color:var(--acc); }
.cfb .badge { display:inline-flex; align-items:center; font-family:Inter,system-ui,sans-serif;
       font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
       padding:3px 7px; border-radius:5px; border:1px solid; white-space:nowrap; }
.cfb .av { border-radius:10px; display:flex; align-items:center; justify-content:center;
       font-family:'Barlow Condensed',sans-serif; font-weight:800; color:#FFFFFF; flex:0 0 auto; }
.cfb .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cfb .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.cfb .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.cfb .gridL { display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
@media (max-width:640px){ .cfb .grid3 { grid-template-columns:1fr 1fr; }
                          .cfb .grid4 { grid-template-columns:1fr 1fr; }
                          .cfb .gridL { grid-template-columns:1fr 1fr; } }
@media (max-width:420px){ .cfb .grid2, .cfb .grid3 { grid-template-columns:1fr; } }
/* ---- draft room ---- */
.cfb .seg { display:flex; gap:3px; background:var(--surface); border:1px solid var(--line);
       border-radius:11px; padding:3px; overflow-x:auto; scrollbar-width:none; }
.cfb .seg::-webkit-scrollbar { display:none; }
.cfb .seg button { flex:1 0 auto; min-width:78px; min-height:38px; border:0; cursor:pointer;
       background:transparent; color:var(--muted); border-radius:8px; padding:8px 12px;
       font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14.5px;
       text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; transition:.14s; }
.cfb .seg button:hover { color:var(--text); }
.cfb .seg button.on { background:var(--acc); color:var(--on-acc); }
.cfb .clockbar { position:sticky; top:96px; z-index:25; margin-bottom:14px; }
.cfb .bscroll { overflow-x:auto; overflow-y:visible; -webkit-overflow-scrolling:touch;
       border:1px solid var(--line); border-radius:14px; background:var(--surface); }
.cfb .bgrid { display:grid; }
.cfb .bh { position:sticky; top:0; z-index:3; background:var(--panel);
       border-bottom:1px solid var(--line); padding:7px 4px; text-align:center; }
.cfb .brnd { position:sticky; left:0; z-index:4; background:var(--panel);
       border-right:1px solid var(--line); display:flex; align-items:center;
       justify-content:center; font-family:Inter,system-ui,sans-serif; font-weight:700;
       font-size:11px; color:var(--muted); }
.cfb .bcorner { position:sticky; left:0; top:0; z-index:6; background:var(--panel2);
       border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.cfb .bcell { border-right:1px solid var(--line); border-bottom:1px solid var(--line);
       padding:6px 5px; min-height:54px; display:flex; flex-direction:column;
       justify-content:center; overflow:hidden; }
.cfb .pulse { animation:cfbpulse 1.9s ease-in-out infinite; }
@keyframes cfbpulse { 0%,100%{opacity:1} 50%{opacity:.42} }
.cfb .tick { font-family:Inter,system-ui,sans-serif; font-variant-numeric:tabular-nums; }
.cfb .topbar { position:sticky; top:0; z-index:60; background:rgba(246,247,249,.94);
       backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.cfb .menubtn { width:42px; height:42px; border-radius:11px; border:1px solid var(--line);
       background:var(--panel); color:var(--text); display:flex; align-items:center;
       justify-content:center; cursor:pointer; flex:0 0 auto; }
.cfb .menubtn:active { background:var(--panel2); }
/* The drawer slides in from the left and pushes the page across, rather than
   covering it. --drawerw is capped so a narrow phone still shows a slice of the
   page behind, which is what makes the push read as a push. */
.cfb { --drawerw: min(300px, 80vw); }
.cfb .appwrap { transition:transform .22s cubic-bezier(.4,0,.2,1); will-change:transform; }
.cfb .appwrap.pushed { transform:translateX(var(--drawerw)); }
.cfb .scrim { position:fixed; inset:0; z-index:88; background:rgba(20,25,34,.32);
       opacity:0; pointer-events:none; transition:opacity .22s ease; }
.cfb .scrim.on { opacity:1; pointer-events:auto; }
.cfb .drawerpanel { position:fixed; top:0; bottom:0; left:0; width:var(--drawerw);
       z-index:92; background:var(--panel); border-right:1px solid var(--line);
       display:flex; flex-direction:column; overflow-y:auto;
       transform:translateX(-100%); transition:transform .22s cubic-bezier(.4,0,.2,1);
       will-change:transform; }
.cfb .drawerpanel.open { transform:translateX(0); }
@keyframes drawerin { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
.cfb .menuitem { display:flex; align-items:center; gap:13px; width:100%; padding:14px 4px;
       background:none; border:0; border-bottom:1px solid var(--line); color:var(--text);
       font:inherit; text-align:left; cursor:pointer; }
.cfb .menuitem:active { background:var(--panel); }
.cfb .menuitem.act { color:var(--acc); }
.cfb .menugroup { font-family:Inter,system-ui,sans-serif; font-size:9.5px; letter-spacing:.14em;
       text-transform:uppercase; color:var(--faint); margin:22px 0 4px; font-weight:600; }
@media (prefers-reduced-motion:reduce) { .cfb .drawerpanel, .cfb .appwrap, .cfb .scrim { transition:none; } }
.cfb .sheet { position:fixed; inset:0; z-index:80; background:rgba(20,25,34,.45);
       backdrop-filter:blur(4px); display:flex; align-items:center;
       justify-content:center; padding:18px; }
.cfb .sheetcard { background:var(--surface); border:1px solid var(--line); border-radius:16px;
       padding:18px; width:100%; max-width:390px; box-shadow:0 18px 50px rgba(20,25,34,.18); }
.cfb .livetag { display:inline-block; margin-left:5px; font-family:Inter,system-ui,sans-serif;
       font-size:8.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
       color:var(--win); vertical-align:1px; }
.cfb .livedot { width:6px; height:6px; border-radius:4px; background:var(--win);
       flex:0 0 auto; }
.cfb .projtag { font-family:Inter,system-ui,sans-serif; font-size:8.5px; font-weight:700;
       color:var(--acc); text-transform:uppercase; letter-spacing:.06em; }
.cfb .lockdot { display:inline-flex; align-items:center; justify-content:center;
       width:14px; height:14px; border-radius:4px; background:var(--acc);
       color:var(--on-acc); font:800 9px/1 Inter,system-ui,sans-serif; flex:0 0 auto; }
.cfb .rankpill { font-family:Inter,system-ui,sans-serif; font-weight:700; font-size:10.5px;
       min-width:26px; text-align:center; padding:2px 5px; border-radius:5px;
       background:var(--panel2); border:1px solid var(--line); color:var(--muted); }
.cfb .big { font-family:Inter,system-ui,sans-serif; font-variant-numeric:tabular-nums;
       font-weight:700; letter-spacing:-.02em; }
@media (prefers-reduced-motion:reduce){ .cfb * { transition:none !important; }
                                        .cfb .pulse { animation:none !important; } }
